name: Toolkit checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: docker compose build kit
      - run: docker compose run --rm kit doctor
      - run: docker compose run --rm kit validate projects/pemedes.vapt.yml
      - run: vapt check . --static
      - name: Test local Semgrep rules without remote services
        run: |
          docker run --rm --network=none \
            -v "$PWD:/src:ro" -v "$PWD/vaptkit/rules:/rules:ro" \
            -e SEMGREP_SEND_METRICS=off -e SEMGREP_ENABLE_VERSION_CHECK=0 \
            --entrypoint=semgrep \
            semgrep/semgrep@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198 \
            --test --config=/rules /src/tests/semgrep --metrics=off --disable-version-check
      - run: docker compose --profile report build report
      - name: Exercise XSS evidence in the isolated local browser lab
        run: |
          docker compose run --rm --entrypoint python \
            -v "$PWD/tests:/tests:ro" -e MVK_RUN_XSS_LAB=1 \
            report -m unittest discover -s /tests -p test_xss_lab.py -v
      - name: Export synthetic report offline
        run: |
          docker compose run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/tests/fixtures:/input:ro" -v "$RUNNER_TEMP:/output" \
            report report /input/assessment.json --output /output/report-smoke --reviewed
