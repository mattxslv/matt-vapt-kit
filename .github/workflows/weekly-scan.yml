# Weekly committed-code scan of the team's app repositories.
# Runs from this toolkit repo so nothing is committed to the app repos
# (pushing to their main branches triggers production deploys).
# Requires the SCAN_REPOS_TOKEN secret: a fine-grained token with read-only
# Contents access to the repositories listed in the matrix.
name: Weekly security scan
on:
  schedule:
    - cron: "0 0 * * 1" # Monday 08:00 PHT
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: mattxslv/dtap
            config: projects/dtap.vapt.yml
          - repo: mattxslv/pemedes
            config: projects/pemedes.vapt.yml
          - repo: mattxslv/startup-ph
            config: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.SCAN_REPOS_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Detect pnpm project
        id: project
        run: |
          if test -f target/package.json; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        if: steps.project.outputs.node == 'true'
        with:
          package_json_file: target/package.json
          run_install: false
      - run: pip install --quiet -e .
      - name: Scan
        env:
          CONFIG: ${{ matrix.config }}
        run: |
          args=(--plain --output "$RUNNER_TEMP/scan-output")
          if [[ -n "$CONFIG" ]]; then args+=(--config "$CONFIG"); fi
          vapt scan target "${args[@]}"
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scan-${{ strategy.job-index }}-${{ github.run_id }}
          path: ${{ runner.temp }}/scan-output
          retention-days: 30
          if-no-files-found: ignore
