name: Matt VAPT push checks
description: Check committed secrets, pnpm dependencies and local static-analysis rules.
inputs:
  static:
    description: Run the bundled Semgrep rules
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: "3.12"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: "22"
    - name: Detect pnpm project
      id: project
      shell: bash
      run: |
        if test -f package.json; then
          echo "node=true" >> "$GITHUB_OUTPUT"
        fi
    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      if: steps.project.outputs.node == 'true'
      with:
        run_install: false
    - name: Run checks
      shell: bash
      env:
        KIT_PATH: ${{ github.action_path }}
        RUN_STATIC: ${{ inputs.static }}
      run: |
        python -m venv "$RUNNER_TEMP/matt-vapt-venv"
        "$RUNNER_TEMP/matt-vapt-venv/bin/pip" install --quiet "$KIT_PATH"
        args=()
        if [[ "$RUN_STATIC" == "true" ]]; then args+=(--static); fi
        "$RUNNER_TEMP/matt-vapt-venv/bin/vapt" check . "${args[@]}"
