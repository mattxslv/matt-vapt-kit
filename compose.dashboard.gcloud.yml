services:
  dashboard:
    user: "${MVK_UID:?Set MVK_UID to your user ID}:${MVK_GID:?Set MVK_GID to your group ID}"
    volumes:
      - type: bind
        source: ./.private/dashboard-data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.config/gcloud
        target: /gcloud-source
        read_only: true
        bind:
          create_host_path: false
