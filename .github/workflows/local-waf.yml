name: Local WAF lab
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  waf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: docker compose build kit
      - name: Pull the pinned upstream WAF image
        run: |
          docker pull "$(python -c 'import json; print(json.load(open("tests/fixtures/waf-images.json"))["waf"])')"
      - name: Exercise isolated enforcement and detection-only modes
        env:
          MVK_RUN_WAF_LAB: "1"
        run: python -m unittest discover -s tests -p test_waf_lab.py -v
