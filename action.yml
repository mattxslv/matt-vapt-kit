name: Matt VAPT push checks
description: Check committed secrets, dependency lockfiles and local static-analysis rules.
inputs:
  static:
    description: Run the bundled Semgrep rules
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: "3.12"
    - name: Run checks
      shell: bash
      env:
        KIT_PATH: ${{ github.action_path }}
        RUN_STATIC: ${{ inputs.static }}
      run: |
        python -m venv "$RUNNER_TEMP/matt-vapt-venv"
        "$RUNNER_TEMP/matt-vapt-venv/bin/pip" install --quiet "$KIT_PATH"
        args=()
        if [[ "$RUN_STATIC" == "true" ]]; then args+=(--static); fi
        "$RUNNER_TEMP/matt-vapt-venv/bin/vapt" check . "${args[@]}"
