rules:
  - id: raw-sql-with-variables
    message: Raw SQL is built from variables. Use ? bindings or the query builder so input can't change the query.
    severity: ERROR
    languages: [php]
    patterns:
      - pattern-either:
          - pattern: DB::$METHOD("..." . $X, ...)
          - pattern: DB::$METHOD($X . "...", ...)
          - pattern: $Q->$METHOD("..." . $X, ...)
          - pattern: $Q->$METHOD($X . "...", ...)
          - pattern: DB::$METHOD("...$X...", ...)
          - pattern: $Q->$METHOD("...$X...", ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(raw|select|statement|unprepared|insert|update|delete|whereRaw|orWhereRaw|selectRaw|orderByRaw|havingRaw|groupByRaw|fromRaw|query|exec|prepare)$
    paths:
      exclude:
        - "*.blade.php"
        - "database/migrations/**"
        - "**/database/migrations/**"

  - id: shell-command-with-variables
    message: A shell command is built from variables. Pass arguments separately (Symfony Process) or wrap each one in escapeshellarg().
    severity: ERROR
    languages: [php]
    patterns:
      - pattern-either:
          - pattern: $FN("..." . $X, ...)
          - pattern: $FN($X . "...", ...)
          - pattern: $FN($X, ...)
      - metavariable-regex:
          metavariable: $FN
          regex: ^(exec|shell_exec|system|passthru|popen|proc_open)$
      - pattern-not: $FN("...", ...)
      - pattern-not: $FN(<... escapeshellarg(...) ...>, ...)
      - pattern-not: $FN(escapeshellcmd(...), ...)
    paths:
      exclude:
        - "*.blade.php"

  - id: upload-keeps-client-filename
    message: An upload is saved under the filename the browser sent. Generate the name yourself (store(), hashName()) and check the type, or attackers can overwrite files or upload scripts.
    severity: ERROR
    languages: [php]
    pattern-either:
      - pattern: $FILE->move($DIR, <... $F->getClientOriginalName() ...>)
      - pattern: $FILE->storeAs($DIR, <... $F->getClientOriginalName() ...>, ...)
      - pattern: $FILE->storePubliclyAs($DIR, <... $F->getClientOriginalName() ...>, ...)
      - pattern: move_uploaded_file($TMP, <... $_FILES[$K]['name'] ...>)
    paths:
      exclude:
        - "*.blade.php"

  - id: hardcoded-secret-in-config
    message: A password, key or token is written directly in the code. Read it with env() (or config()) and keep the value out of Git.
    severity: ERROR
    languages: [php]
    patterns:
      - pattern-either:
          - patterns:
              - pattern: |
                  [..., '$KEY' => '$VALUE', ...]
              - metavariable-regex:
                  metavariable: $KEY
                  regex: (?i)^(password|passwd|secret|client_secret|api_?key|access_?key|private_?key|token|auth_token)$
          - patterns:
              - pattern: |
                  $NAME = '$VALUE';
              - metavariable-regex:
                  metavariable: $NAME
                  regex: (?i)^\$(password|passwd|secret|client_secret|api_?key|access_?key|private_?key|token|auth_token)$
      # Real secrets almost always contain a digit; validation rules and translations rarely do.
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?=.*[0-9])[^\s|]{8,}$
      - focus-metavariable: $VALUE
    paths:
      exclude:
        - "*.blade.php"
        - "lang/**"
        - "**/lang/**"
        - "tests/**"
        - "**/tests/**"

  - id: debug-mode-hardcoded-on
    message: Debug mode is switched on in code. It shows stack traces, settings and secrets to visitors; use 'debug' => env('APP_DEBUG', false).
    severity: ERROR
    languages: [php]
    patterns:
      - pattern: |
          [..., 'debug' => $ON, ...]
      - metavariable-pattern:
          metavariable: $ON
          pattern: "true"
      - focus-metavariable: $ON
    paths:
      exclude:
        - "*.blade.php"
