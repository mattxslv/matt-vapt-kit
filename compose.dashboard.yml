services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: matt-vapt-dashboard:local
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      MVK_DASHBOARD_ORIGIN: http://127.0.0.1:8765
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    shm_size: 256m
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - ./projects:/projects:ro
      - dashboard-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  dashboard-data:
