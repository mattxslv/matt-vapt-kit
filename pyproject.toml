[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matt-vapt-kit"
version = "0.5.0"
description = "Private, staging-first security checks and assessment reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.2", "jsonschema==4.23.0"]

[project.urls]
Repository = "https://github.com/mattxslv/matt-vapt-kit"
Documentation = "https://github.com/mattxslv/matt-vapt-kit/blob/main/docs/getting-started.md"

[project.optional-dependencies]
report = ["playwright==1.58.0"]
dashboard = ["Flask==3.1.2", "waitress==3.0.2"]

[project.scripts]
vapt = "vaptkit.cli:main"
vapt-dashboard = "vaptkit.dashboard:main"

[tool.setuptools.packages.find]
include = ["vaptkit*"]

[tool.setuptools.package-data]
vaptkit = ["schemas/*.json", "assets/*.css", "assets/dashboard/*", "rules/*.yml"]
