# Weekly committed-code scan of the team's app repositories.
# Runs from this toolkit repo so nothing is committed to the app repos
# (pushing to their main branches triggers production deploys).
# Requires the SCAN_REPOS_TOKEN secret: a fine-grained token with read-only
# Contents access to the repositories listed in the matrix.
name: Weekly security scan
on:
  schedule:
    - cron: "0 0 * * 1" # Monday 08:00 PHT
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: mattxslv/dtap
            config: projects/dtap.vapt.yml
            secret_prefix: DTAP
          - repo: mattxslv/pemedes
            config: projects/pemedes.vapt.yml
            secret_prefix: PEMEDES
          - repo: mattxslv/startup-ph
            config: ""
            secret_prefix: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.SCAN_REPOS_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install --quiet -e ".[report]"
      - run: python -m playwright install --with-deps chromium
      - name: Write real project config from secrets
        if: matrix.secret_prefix != ''
        env:
          VAPT_CONFIG: ${{ secrets[format('{0}_VAPT_CONFIG', matrix.secret_prefix)] }}
          REGRESSIONS: ${{ secrets[format('{0}_REGRESSIONS', matrix.secret_prefix)] }}
          STANDING_APPROVAL: ${{ secrets[format('{0}_STANDING_APPROVAL', matrix.secret_prefix)] }}
        run: |
          # The committed projects/*.vapt.yml are sanitized public examples; the real target
          # URLs/service accounts/standing approvals live only in repo secrets, written here at
          # job runtime so they never touch the (public) repo or its history.
          printf '%s' "$VAPT_CONFIG" > "${{ matrix.config }}"
          base="${{ matrix.config }}"
          printf '%s' "$REGRESSIONS" > "${base%.vapt.yml}.regressions.yml"
          printf '%s' "$STANDING_APPROVAL" > "${base%.vapt.yml}.standing-approval.yml"
      - name: Scan
        env:
          CONFIG: ${{ matrix.config }}
        run: |
          args=(--plain --pdf --output "$RUNNER_TEMP/scan-output")
          if [[ -n "$CONFIG" ]]; then args+=(--config "$CONFIG"); fi
          vapt scan target "${args[@]}"
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scan-${{ strategy.job-index }}-${{ github.run_id }}
          path: ${{ runner.temp }}/scan-output
          retention-days: 30
          if-no-files-found: ignore
